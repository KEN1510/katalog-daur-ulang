<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaurUlang.in - Cyber Dark</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
        }

        .cyber-nav {
            background-color: #1e293b;
            border-bottom: 2px solid #22c55e;
        }

        .cyber-hero {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            padding: 4rem 1rem;
            border-bottom: 1px dashed #334155;
        }

        .cyber-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .cyber-card:hover {
            border-color: #22c55e;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.2);
        }

        .cyber-btn {
            background-color: transparent;
            border: 1px solid #22c55e;
            color: #22c55e;
            font-weight: bold;
            border-radius: 4px;
        }

        .cyber-btn:hover,
        .cyber-btn.active {
            background-color: #22c55e;
            color: #0f172a;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar cyber-nav px-4">
        <a class="navbar-brand fw-bold text-success" href="#">// DAURULANG_IN</a>
    </nav>
    <header class="cyber-hero text-center">
        <div class="container">
            <h1 class="display-5 fw-bold text-success mb-3">&gt; KATALOG_SAMPAH_KREATIF</h1>
            <p class="text-secondary mb-4">Sistem pengolahan limbah menjadi artefak bernilai guna tinggi.</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <button class="btn cyber-btn active px-3 py-1">Semua</button>
                <button class="btn cyber-btn px-3 py-1">Alat Elektronik</button>
                <button class="btn cyber-btn px-3 py-1">Botol Plastik</button>
                <button class="btn cyber-btn px-3 py-1">Tutup Botol</button>
                <button class="btn cyber-btn px-3 py-1">Kertas Karton</button>
                <button class="btn cyber-btn px-3 py-1">Besi Kaleng</button>
            </div>
        </div>
    </header>
    <main class="container my-5 flex-grow-1">
        <div class="row g-4">
            <div class="col-md-4 col-sm-6">
                <div class="cyber-card p-3 h-100 d-flex flex-column">
                    <div class="bg-dark border border-secondary rounded mb-3 d-flex align-items-center justify-content-center text-secondary"
                        style="height: 180px;">[Foto_Produk_1]</div>
                    <div class="mb-2">
                        <span class="badge bg-secondary text-light">tutup-botol</span>
                        <span class="badge bg-secondary text-light">alat-elektronik</span>
                    </div>
                    <h5 class="fw-bold text-light">Jam Dinding Tutup Botol</h5>
                    <p class="text-secondary small flex-grow-1">Jam dinding estetik dari rangkaian tutup botol dan mesin
                        jam bekas.</p>
                    <button class="btn cyber-btn btn-sm mt-2 align-self-start">Lihat Detail</button>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
